note: >-
  Promethium is priced by GPU compute hour, billed by the second for actively running tasks, with no charge for
  time spent in the web interface outside task execution. Tasks running in parallel each accrue compute time
  separately. The API itself carries no separate fee — QC Ware's 2023-11-27 launch post states API access is
  "available to all new and existing customers at no additional cost". The /pricing page carries an explicit
  legacy notice: "This pricing applies only to legacy agreements that specifically refer to this pricing page.
  Please contact us regarding current pricing." Both pages are recorded; the /pricing-details tiers are the
  current published set.
