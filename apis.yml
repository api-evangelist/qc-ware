aid: qc-ware
name: QC Ware
description: QC Ware is a quantum and GPU-accelerated computational chemistry company based in Palo Alto, California.
  Its commercial product is Promethium, a cloud-native quantum chemistry platform that runs ab initio DFT and TD-DFT
  calculations on NVIDIA A100/V100 GPUs for systems up to roughly 2,000 atoms, used by pharmaceutical and materials-science
  discovery teams. Promethium exposes a public REST API at api.promethium.qcware.com covering workflow submission
  (single point, geometry optimization, conformer search, torsion scan, interaction energy / F-SAPT, reaction path
  and transition state optimization) and a file/project store, plus a Python SDK and a `promethium`/`pm` command-line
  tool. QC Ware also ran Forge, an earlier quantum computing cloud service with a Python client library, and hosts
  the Q2B quantum computing conference series.
