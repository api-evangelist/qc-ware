note: >-
  Derived from the 4xx/5xx responses the Promethium OpenAPI actually declares. That set is a single entry:
  every one of the 13 operations declares exactly one error response, 422 Validation Error, carrying
  HTTPValidationError. This is the FastAPI default and it is the whole published error surface. The API
  certainly returns other statuses in practice — an absent or wrong X-API-KEY cannot produce a 422 — but QC
  Ware does not declare them, and the hosted API reference at https://app.promethium.qcware.com/docs/api
  returns 403 anonymously so no docs error reference could be read to enrich this. Undeclared statuses are
  listed in `undeclared_but_expected` and are explicitly NOT presented as documented behaviour.
